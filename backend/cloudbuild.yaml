steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/face-calendar-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/face-calendar-backend:latest'
      - '.'
    dir: 'backend'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/face-calendar-backend:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'face-calendar-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/face-calendar-backend:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FIREBASE_CREDENTIALS_FILE=/etc/secrets/firebase-credentials.json,CORS_ALLOWED_ORIGINS=${_FRONTEND_URL},DATABASE_PATH=/tmp/face_calendar.db'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/face-calendar-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/face-calendar-backend:latest'

substitutions:
  _FRONTEND_URL: 'https://face-calendar.vercel.app' # Update this with your Vercel URL

# Grant Cloud Build permissions to access Secret Manager
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/cloud-run-deployer@${PROJECT_ID}.iam.gserviceaccount.com'
